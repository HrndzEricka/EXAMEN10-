<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Práctica U3 · Aplicación de la robótica</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');
:root{
  --navy:#0F1E3D; --navy-2:#182C54; --gold:#C9A227; --gold-dim:#E7D9A8;
  --cream:#F5F1E6; --paper:#FBF9F3; --ink:#181A1F; --slate:#5B6472;
  --line:#DCD4BE; --danger:#A5402A; --good:#3E6B52; --radius:4px;
  --good-bg:#E6EFE8; --bad-bg:#F6E4DE;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--cream);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:'Space Grotesk',sans-serif;}
button{font-family:inherit;cursor:pointer;}
input,select{font-family:inherit;font-size:16px;}

.cover{background:var(--navy);color:#fff;padding:40px 16px 56px;}
.cover-inner{max-width:860px;margin:0 auto;}
.brandbox{background:var(--paper);display:flex;align-items:center;gap:16px;padding:14px 22px;border-radius:var(--radius);max-width:560px;margin-bottom:26px;}
.brandbox img{height:64px;width:auto;}
.brandbox .n{font-weight:700;color:var(--navy);font-size:15px;}
.brandbox .r{color:var(--gold);font-weight:600;font-size:12px;}
.tag{display:inline-block;background:var(--gold);color:var(--navy);font-weight:700;font-size:12px;letter-spacing:.8px;text-transform:uppercase;padding:4px 10px;border-radius:2px;}
.cover h1{font-size:40px;line-height:1.1;margin:14px 0 8px;}
.cover p{color:#C9CEDC;margin:0;max-width:640px;}

.wrap{max-width:860px;margin:-30px auto 60px;padding:0 16px;}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:24px 26px;margin-bottom:22px;box-shadow:0 2px 0 rgba(15,30,61,.04);}
.intro ul{margin:8px 0 0;padding-left:20px;}
.intro li{margin-bottom:4px;}

.sec-head{display:flex;align-items:baseline;gap:12px;border-bottom:2px solid var(--navy);padding-bottom:10px;margin-bottom:6px;}
.sec-head .k{font-family:'IBM Plex Mono',monospace;color:var(--gold);font-weight:600;}
.sec-head h2{margin:0;font-size:22px;color:var(--navy);}
.sec-head .pts{margin-left:auto;color:var(--slate);font-size:14px;}
.instr{color:var(--slate);font-size:14.5px;margin:8px 0 14px;}

.q{padding:18px 0;border-bottom:1px solid var(--line);}
.q:last-child{border-bottom:none;}
.q-text{font-weight:500;margin-bottom:10px;}
.q-num{font-family:'Space Grotesk',sans-serif;font-weight:700;color:var(--navy);margin-right:6px;}
.ra{font-size:11.5px;color:var(--slate);font-family:'IBM Plex Mono',monospace;margin-left:6px;white-space:nowrap;}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.opt{display:flex;gap:9px;align-items:center;border:1px solid var(--line);background:#fff;border-radius:var(--radius);padding:11px 14px;cursor:pointer;font-size:16px;}
.opt:has(input:checked){border-color:var(--navy);background:#EFE9D8;}
.opt .l{font-weight:700;color:var(--navy);}
.checked .opt.is-correct{border-color:var(--good);background:var(--good-bg);}
.checked .opt.is-wrong{border-color:var(--danger);background:var(--bad-bg);}
.checked .opt.is-wrong:has(input:checked){border-color:var(--danger);background:var(--bad-bg);}
.checked .opt{cursor:default;}

.blanks{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.blank{display:flex;align-items:center;gap:8px;}
.blank span{font-family:'IBM Plex Mono',monospace;color:var(--slate);font-size:14px;}
.blank input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;}
.blank input.ok{border-color:var(--good);background:var(--good-bg);}
.blank input.no{border-color:var(--danger);background:var(--bad-bg);}

.c-item{margin-top:10px;padding-top:6px;}
.c-item h3{font-size:17px;color:var(--navy-2);margin:14px 0 4px;}
.names{background:#F2ECDC;border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px 16px;font-size:15.5px;margin:10px 0 6px;}
.names .t{grid-column:1/-1;font-weight:700;color:var(--navy);font-size:14px;margin-bottom:2px;}
.match{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px dashed var(--line);}
.match .txt{flex:1;}
.match select{width:200px;padding:9px 10px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;}
.match select.ok{border-color:var(--good);background:var(--good-bg);}
.match select.no{border-color:var(--danger);background:var(--bad-bg);}

.fb{margin-top:10px;font-size:14.5px;padding:10px 14px;border-left:3px solid var(--good);background:var(--good-bg);border-radius:0 var(--radius) var(--radius) 0;}
.fb.bad{border-left-color:var(--danger);background:var(--bad-bg);}
.fb b{font-weight:600;}

.bar{position:sticky;bottom:0;background:var(--navy);color:#fff;padding:12px 16px;z-index:5;}
.bar-inner{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.bar .count{font-family:'IBM Plex Mono',monospace;font-size:14px;color:var(--gold-dim);}
.btn{border:none;border-radius:var(--radius);padding:11px 20px;font-weight:700;font-size:15px;}
.btn-gold{background:var(--gold);color:var(--navy);}
.btn-ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);}
.btn-dark{background:var(--navy);color:#fff;}
.bar .sp{margin-left:auto;display:flex;gap:10px;}

.result{text-align:center;}
.result .big{font-family:'Space Grotesk',sans-serif;font-size:64px;font-weight:700;color:var(--navy);line-height:1;}
.result .sub{color:var(--slate);}
.msg{font-weight:600;margin:12px 0 18px;}
.secs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0;}
.secs div{background:#F2ECDC;border-radius:var(--radius);padding:10px;}
.secs .lb{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--slate);}
.secs .v{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;color:var(--navy);}
.tema{text-align:left;margin-bottom:10px;}
.tema .row{display:flex;justify-content:space-between;font-size:14px;margin-bottom:3px;}
.tema .track{height:9px;background:var(--line);border-radius:5px;overflow:hidden;}
.tema .fill{height:100%;}
.hint{color:var(--slate);font-size:13.5px;}

@media (max-width:640px){
  .cover h1{font-size:30px;}
  .opts,.blanks,.secs{grid-template-columns:1fr;}
  .names{grid-template-columns:1fr 1fr;}
  .match{flex-direction:column;align-items:stretch;gap:8px;}
  .match select{width:100%;}
  .card{padding:20px 16px;}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
const DATA = {"temas": {"ra1": "RA1 · Automatización robotizada", "ra2": "RA2 · Mecanismos y máquinas", "ra3": "RA3 · Máquinas simples y compuestas", "ra4": "RA4 · Motores y simuladores", "ra5": "RA5 · Tecnologías robóticas", "ra6": "RA6 · Robots y retos"}, "su": [{"id": 1, "tema": "ra1", "text": "Etapa del ciclo robotizado en la que los sensores captan información del entorno:", "opts": ["Percepción", "Razonamiento", "Acción"], "exp": "Sensor = percepción · Controlador = razonamiento · Actuador = acción."}, {"id": 2, "tema": "ra1", "text": "Una moledora con botón, en la que la persona decide y la máquina aporta la fuerza, corresponde al nivel:", "opts": ["Mecanizado", "Manual", "Automático"], "exp": "Mecanizado: la persona decide; la máquina aporta fuerza (ejemplo: moledora con botón)."}, {"id": 3, "tema": "ra1", "text": "Una línea de producción que aparta sola las piezas defectuosas corresponde al nivel:", "opts": ["Automático", "Semiautomático", "Mecanizado"], "exp": "Automático: el sistema percibe, decide y actúa (ejemplo: línea que aparta piezas defectuosas)."}, {"id": 4, "tema": "ra1", "text": "Componente que ejecuta la acción física en un sistema robotizado:", "opts": ["Actuador", "Sensor", "Controlador"], "exp": "El actuador ejecuta un movimiento o acción física: motor, servomotor, cilindro neumático, zumbador o relé."}, {"id": 5, "tema": "ra1", "text": "Tipo de tarea que conviene automatizar:", "opts": ["Repetitiva o peligrosa", "Que se realiza una sola vez", "Que no requiere precisión"], "exp": "Conviene automatizar tareas repetitivas, peligrosas, de alta precisión o continuas."}, {"id": 6, "tema": "ra2", "text": "Mecanismo de transformación que convierte un giro en movimiento alternativo:", "opts": ["Biela-manivela", "Engranajes", "Cadena y piñón"], "exp": "Biela-manivela: transformación giro ↔ alternativo (ejemplo: máquina de coser de pedal)."}, {"id": 7, "tema": "ra2", "text": "Movimiento en línea recta, como el de un cajón o un portón corredizo:", "opts": ["Lineal", "Rotativo", "Alternativo"], "exp": "Movimiento lineal: en línea recta, como el de un cajón o un portón corredizo."}, {"id": 8, "tema": "ra2", "text": "Parte de una máquina que aporta la energía o la fuerza de entrada:", "opts": ["Elemento motor", "Elemento receptor", "Mecanismo de transmisión"], "exp": "Toda máquina tiene elemento motor (aporta la energía), mecanismo de transmisión y elemento receptor."}, {"id": 9, "tema": "ra2", "text": "Mecanismo que transforma un giro en subir y bajar, como en las válvulas de un motor:", "opts": ["Leva", "Polea con correa", "Piñón-cremallera"], "exp": "Leva: transformación giro → subir y bajar (ejemplo: válvulas de un motor)."}, {"id": 10, "tema": "ra2", "text": "Mecanismo que transmite el giro a distancia, como en el motor de la lavadora:", "opts": ["Polea con correa", "Biela-manivela", "Leva"], "exp": "Polea con correa: transmisión a distancia (ejemplo: motor de lavadora). Ojo: la correa floja patina."}, {"id": 11, "tema": "ra3", "text": "Una carga de 30 kg está a 0,4 m del punto de apoyo y se empuja a 1,2 m. La fuerza necesaria es:", "opts": ["10 kg", "20 kg", "90 kg"], "exp": "Ley de la palanca: F × 1,2 = 30 × 0,4 → F = 12 ÷ 1,2 = 10 kg."}, {"id": 12, "tema": "ra3", "text": "Un engranaje conductor de 40 dientes da 3 vueltas y mueve uno conducido de 20 dientes. El conducido da:", "opts": ["6 vueltas", "1,5 vueltas", "12 vueltas"], "exp": "Vueltas del conducido = 3 × (40 ÷ 20) = 6 vueltas."}, {"id": 13, "tema": "ra3", "text": "Cuando un engranaje pequeño se acopla a uno grande, el pequeño:", "opts": ["Gira más rápido", "Gira más lento", "Gira a la misma velocidad"], "exp": "El engranaje pequeño gira más rápido; el grande gira más lento pero con más fuerza."}, {"id": 14, "tema": "ra3", "text": "Máquina compuesta formada por dos palancas y dos cuñas:", "opts": ["Tijeras", "Carretilla", "Grúa"], "exp": "Tijeras = dos palancas + dos cuñas."}, {"id": 15, "tema": "ra3", "text": "Máquina simple en pendiente que reduce el esfuerzo para subir una carga a cambio de recorrer más distancia:", "opts": ["Plano inclinado", "Cuña", "Tornillo"], "exp": "Plano inclinado: menos esfuerzo para subir una carga a cambio de más distancia."}, {"id": 16, "tema": "ra3", "text": "Unión que transmite el movimiento mediante una correa o una cadena:", "opts": ["Acople indirecto", "Acople directo", "Relación de transmisión"], "exp": "Acople indirecto: con correa o cadena. En el acople directo las piezas se tocan y giran en sentidos opuestos."}, {"id": 17, "tema": "ra4", "text": "En un circuito en paralelo, si uno de los receptores falla:", "opts": ["Los demás siguen funcionando", "Todo el circuito se apaga", "El voltaje se reparte entre los demás"], "exp": "En paralelo cada rama es independiente y recibe el voltaje completo; en serie, si falla uno, se apaga todo."}, {"id": 18, "tema": "ra4", "text": "Motor que conviene para mover una barrera exactamente a 90°:", "opts": ["Servomotor", "Motor DC", "Motor AC"], "exp": "El servomotor va a un ángulo exacto (0° a 180°) y lo mantiene."}, {"id": 19, "tema": "ra4", "text": "Motor que usa aire comprimido para generar movimiento:", "opts": ["Motor neumático", "Motor paso a paso", "Servomotor"], "exp": "Motor neumático: usa aire comprimido; común en herramientas industriales."}, {"id": 20, "tema": "ra4", "text": "Control que regula una máquina mediante topes, levas y resortes:", "opts": ["Control mecánico", "Control eléctrico", "Control por relé"], "exp": "Control mecánico: topes, levas, resortes y engranajes. Control eléctrico: interruptores, relés, sensores."}, {"id": 21, "tema": "ra4", "text": "Motor DC con engranajes que reducen la velocidad y aumentan la fuerza:", "opts": ["Motorreductor", "Servomotor", "Motor AC"], "exp": "Motorreductor: motor DC con engranajes que reducen la velocidad y aumentan la fuerza."}, {"id": 22, "tema": "ra4", "text": "Ejemplo de simulador eléctrico para armar circuitos virtuales:", "opts": ["Tinkercad Circuits", "Factory I/O", "RoboDK"], "exp": "Simulador eléctrico: Tinkercad Circuits o Proteus. RoboDK y Factory I/O son simuladores informáticos."}, {"id": 23, "tema": "ra5", "text": "Sensor que detecta el movimiento de personas o animales:", "opts": ["PIR", "LDR", "Humedad de suelo"], "exp": "Sensor PIR: detecta movimiento de personas; entrega señal digital."}, {"id": 24, "tema": "ra5", "text": "El sensor infrarrojo de línea detecta:", "opts": ["Si la superficie es clara u oscura", "La distancia con el eco", "La cantidad de agua en la tierra"], "exp": "Infrarrojo de línea: superficie clara u oscura; señal digital."}, {"id": 25, "tema": "ra5", "text": "Ejemplo de herramienta de programación por bloques:", "opts": ["Scratch", "Python", "Java"], "exp": "Por bloques: Scratch, Blockly. Por texto: C/C++, Python, Java."}, {"id": 26, "tema": "ra5", "text": "Antes de programar un robot se recomienda planificar en:", "opts": ["Pseudocódigo", "Monitor serie", "Driver de motores"], "exp": "Se programa por bloques o por texto; antes se planifica en pseudocódigo."}, {"id": 27, "tema": "ra6", "text": "Un rover en Marte que planifica y aprende continuamente es un robot de nivel:", "opts": ["4, autónomo avanzado", "2, adaptativo", "1, programado"], "exp": "Nivel 4, autónomo avanzado: planifica y aprende continuamente (ejemplo: rover en Marte)."}, {"id": 28, "tema": "ra6", "text": "Un vehículo autónomo que usa IA para aprender y decidir es un robot de nivel:", "opts": ["3, inteligente", "1, programado", "2, adaptativo"], "exp": "Nivel 3, inteligente: usa IA para aprender y decidir (ejemplo: vehículo autónomo)."}, {"id": 29, "tema": "ra6", "text": "Automatización aplicada a edificios completos: accesos, ascensores, climatización y seguridad:", "opts": ["Inmótica", "Domótica", "Mecanizado"], "exp": "Inmótica = edificios completos. Domótica = el hogar."}, {"id": 30, "tema": "ra6", "text": "Un robot logra su tarea en 14 de 20 intentos. ¿Qué porcentaje de éxito tiene?", "opts": ["70 %", "14 %", "60 %"], "exp": "Efectividad = éxitos ÷ intentos × 100 = 14 ÷ 20 × 100 = 70 %."}], "rc": [{"id": 1, "tema": "ra3", "text": "Escriba CUATRO de las seis máquinas simples.", "ref": "Palanca, plano inclinado, polea, rueda y eje, cuña, tornillo", "sets": [["palanca"], ["plano inclinado", "plano"], ["polea"], ["rueda y eje", "rueda"], ["cuna"], ["tornillo"]], "max": 4}, {"id": 2, "tema": "ra1", "text": "Escriba los CUATRO niveles de automatización.", "ref": "Manual, mecanizado, semiautomático, automático", "sets": [["manual"], ["mecanizado"], ["semiautomatico", "semi automatico"], ["automatico"]], "max": 4}, {"id": 3, "tema": "ra6", "text": "Escriba los CUATRO niveles de inteligencia de los robots.", "ref": "Programado, adaptativo, inteligente, autónomo avanzado", "sets": [["programado"], ["adaptativo"], ["inteligente"], ["autonomo avanzado", "autonomo"]], "max": 4}, {"id": 4, "tema": "ra5", "text": "Escriba los CUATRO componentes de un sistema robótico.", "ref": "Sensores, controlador, actuadores, comunicación", "sets": [["sensor"], ["controlador"], ["actuador"], ["comunicacion"]], "max": 4}, {"id": 5, "tema": "ra2", "text": "Escriba DOS ejemplos de mecanismos de transformación.", "ref": "Piñón-cremallera, biela-manivela, leva", "sets": [["pinon cremallera", "pinoncremallera", "cremallera"], ["biela manivela", "bielamanivela", "biela"], ["leva"]], "max": 2}, {"id": 6, "tema": "ra2", "text": "Escriba DOS ejemplos de mecanismos de transmisión.", "ref": "Engranajes, polea con correa, cadena y piñón", "sets": [["engranaje"], ["polea con correa", "polea", "correa"], ["cadena y pinon", "cadena"]], "max": 2}, {"id": 7, "tema": "ra4", "text": "Escriba TRES tipos de motores.", "ref": "Motor DC (motorreductor), paso a paso, servomotor, motor AC, hidráulico, neumático", "sets": [["dc", "motorreductor"], ["paso a paso"], ["servo"], ["ac", "corriente alterna"], ["hidraulico"], ["neumatico"]], "max": 3}, {"id": 8, "tema": "ra5", "text": "Escriba DOS lenguajes de programación por texto.", "ref": "C/C++, Python, Java", "sets": [["c++", "c/c++", "c", "cpp"], ["python"], ["java"]], "max": 2}, {"id": 9, "tema": "ra4", "text": "Escriba DOS simuladores vistos en la unidad.", "ref": "Tinkercad, Proteus, RoboDK, Factory I/O", "sets": [["tinkercad"], ["proteus"], ["robodk"], ["factory io", "factory i/o", "factory"]], "max": 2}, {"id": 10, "tema": "ra6", "text": "Escriba TRES ámbitos en los que se aplica la robótica.", "ref": "Industria, automotriz, domótica, inmótica, medicina, espacio, mar, sector social, empresas", "sets": [["industria", "industrial"], ["automotriz"], ["domotica", "hogar"], ["inmotica", "edificio"], ["medicina", "medico"], ["espacio", "espacial"], ["mar", "marino"], ["social"], ["empresa"]], "max": 3}], "c": [{"tema": "ra5", "titulo": "Ítem 1 · Sensores y lo que miden", "instr": "En la columna A aparece lo que mide cada sensor y en la columna B, su nombre. Para cada descripción, elija la letra del sensor que le corresponde. Cada nombre se utiliza una sola vez y uno no se utiliza. (Valor 5 puntos)", "nombres": ["Final de carrera", "Humedad de suelo", "Infrarrojo de línea", "LDR", "PIR", "Ultrasónico"], "pares": [["Calcula la distancia a un objeto midiendo el tiempo del eco de un sonido.", "Ultrasónico"], ["Detecta si la superficie es clara u oscura.", "Infrarrojo de línea"], ["Mide la cantidad de luz y entrega una señal analógica.", "LDR"], ["Mide la cantidad de agua en la tierra.", "Humedad de suelo"], ["Detecta el movimiento de personas o animales.", "PIR"]]}, {"tema": "ra4", "titulo": "Ítem 2 · Motores y su uso ideal", "instr": "En la columna A aparece el uso ideal de cada motor y en la columna B, su nombre. Para cada uso, elija la letra del motor que le corresponde. Cada nombre se utiliza una sola vez y uno no se utiliza. (Valor 5 puntos)", "nombres": ["Motor AC", "Motor DC", "Motor hidráulico", "Motor neumático", "Paso a paso", "Servomotor"], "pares": [["Ruedas de robots, ventiladores y portones; gira de forma continua.", "Motor DC"], ["Impresoras 3D y máquinas CNC, por su posición precisa.", "Paso a paso"], ["Brazos y barreras que deben quedar en un ángulo exacto.", "Servomotor"], ["Lavadoras, bombas e industria; potente y duradero.", "Motor AC"], ["Maquinaria pesada; transforma la energía de un fluido a presión.", "Motor hidráulico"]]}, {"tema": "ra3", "titulo": "Ítem 3 · Máquinas compuestas", "instr": "En la columna A aparecen las máquinas simples que forman cada máquina compuesta y en la columna B, su nombre. Para cada combinación, elija la letra de la máquina compuesta que le corresponde. Cada nombre se utiliza una sola vez. (Valor 5 puntos)", "nombres": ["Abrelatas de manivela", "Bicicleta", "Carretilla", "Grúa", "Tijeras"], "pares": [["Palanca de segunda clase + rueda y eje.", "Carretilla"], ["Dos palancas + dos cuñas.", "Tijeras"], ["Poleas + palanca + rueda y eje.", "Grúa"], ["Palanca + cuña + rueda y eje.", "Abrelatas de manivela"], ["Ruedas y ejes + palancas + cadena.", "Bicicleta"]]}]};

function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function norm(s){ return (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[-_]/g," ").replace(/[^a-z0-9+\/\s]/g,"").replace(/\s+/g," ").trim(); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function rcMatch(q, arr){
  const used = new Set(); const ok = [];
  arr.forEach((v,i)=>{
    const n = norm(v); ok[i]=false; if(!n) return;
    for(let si=0; si<q.sets.length; si++){
      if(used.has(si)) continue;
      const hit = q.sets[si].some(k=>{
        if(n===k) return true;
        if(k.length<=3) return n.split(" ").includes(k) || n==="motor "+k;
        return n.includes(k) || (n.length>=6 && k.includes(n));
      });
      if(hit){ used.add(si); ok[i]=true; break; }
    }
  });
  return ok;
}
function grade(){
  const t = {}; Object.keys(DATA.temas).forEach(k=>t[k]={e:0,p:0});
  let su=0, rc=0, c=0;
  DATA.su.forEach((q,i)=>{ t[q.tema].p++; if(S.su[i]===0){ su++; t[q.tema].e++; } });
  DATA.rc.forEach((q,i)=>{ const pts = rcMatch(q, S.rc[i]||[]).filter(Boolean).length; rc+=pts; t[q.tema].p+=q.max; t[q.tema].e+=pts; });
  DATA.c.forEach((it,g)=>it.pares.forEach((p,i)=>{ t[it.tema].p++; if(S.c[g+"-"+i]===p[1]){ c++; t[it.tema].e++; } }));
  const max = { su:DATA.su.length, rc:DATA.rc.reduce((s,q)=>s+q.max,0), c:DATA.c.length*5 };
  return {su, rc, c, total:su+rc+c, max, maxTotal:max.su+max.rc+max.c, temas:t};
}
function answeredCount(){
  let n = Object.keys(S.su).length;
  DATA.rc.forEach((q,i)=>{ (S.rc[i]||[]).forEach(v=>{ if((v||"").trim()) n++; }); });
  n += Object.values(S.c).filter(Boolean).length;
  return n;
}
const TOTAL_ITEMS = DATA.su.length + DATA.rc.reduce((s,q)=>s+q.max,0) + DATA.c.length*5;

/* ---------- vista ---------- */
function renderSU(){
  return S.suOrder.map((qi,pos)=>{
    const q = DATA.su[qi]; const given = S.su[qi];
    const opts = S.optOrder[qi].map((oi,op)=>{
      let cls = "";
      if(S.checked){ if(oi===0) cls="is-correct"; else if(given===oi) cls="is-wrong"; }
      return `<label class="opt ${cls}"><input type="radio" name="su${qi}" ${given===oi?"checked":""} ${S.checked?"disabled":""} data-su="${qi}" data-o="${oi}"><span class="l">${L[op]})</span> <span>${esc(q.opts[oi])}</span></label>`;
    }).join("");
    let fb = "";
    if(S.checked){
      const ok = given===0;
      fb = `<div class="fb ${ok?"":"bad"}"><b>${ok?"¡Correcto!":(given===undefined?"Sin responder.":"Incorrecto.")}</b> ${ok?"":"Respuesta: <b>"+esc(q.opts[0])+"</b>. "}${esc(q.exp)}</div>`;
    }
    return `<div class="q"><div class="q-text"><span class="q-num">${pos+1}.</span>${esc(q.text)}<span class="ra">${q.tema.toUpperCase()}</span></div><div class="opts">${opts}</div>${fb}</div>`;
  }).join("");
}
function renderRC(){
  return S.rcOrder.map((qi,pos)=>{
    const q = DATA.rc[qi]; const arr = S.rc[qi]||[];
    const ok = S.checked ? rcMatch(q, arr) : [];
    let inputs = "";
    for(let i=0;i<q.max;i++){
      const cls = S.checked ? (ok[i]?"ok":"no") : "";
      inputs += `<div class="blank"><span>${i+1})</span><input type="text" class="${cls}" value="${esc(arr[i]||"")}" ${S.checked?"disabled":""} data-rc="${qi}" data-i="${i}" autocomplete="off" spellcheck="false"></div>`;
    }
    let fb = "";
    if(S.checked){
      const pts = ok.filter(Boolean).length;
      fb = `<div class="fb ${pts===q.max?"":"bad"}"><b>${pts} de ${q.max} puntos.</b> Respuestas válidas: ${esc(q.ref)}.</div>`;
    }
    return `<div class="q"><div class="q-text"><span class="q-num">${pos+1}.</span>${esc(q.text)} <span class="hint">(${q.max} pts)</span><span class="ra">${q.tema.toUpperCase()}</span></div><div class="blanks">${inputs}</div>${fb}</div>`;
  }).join("");
}
function renderC(){
  return DATA.c.map((it,g)=>{
    const names = it.nombres.map((n,i)=>`<div><b>${L[i]}.</b> ${esc(n)}</div>`).join("");
    const usados = it.pares.map((_,i)=>S.c[g+"-"+i]).filter(Boolean);
    const rows = S.cOrder[g].map((pi,pos)=>{
      const [txt, ans] = it.pares[pi]; const key = g+"-"+pi; const given = S.c[key]||"";
      const cls = S.checked ? (given===ans?"ok":"no") : "";
      const options = it.nombres.map((n,i)=> (usados.includes(n) && n!==given && !S.checked) ? "" : `<option value="${esc(n)}" ${n===given?"selected":""}>${L[i]} — ${esc(n)}</option>`).join("");
      const fb = S.checked && given!==ans ? `<div class="fb bad" style="margin-top:6px;">Respuesta: <b>${L[it.nombres.indexOf(ans)]} — ${esc(ans)}</b></div>` : "";
      return `<div class="match"><div class="txt"><b>${pos+1}.</b> ${esc(txt)}${fb}</div><select class="${cls}" data-c="${key}" ${S.checked?"disabled":""}><option value="">—</option>${options}</select></div>`;
    }).join("");
    return `<div class="c-item"><h3>${esc(it.titulo)} <span class="ra">${it.tema.toUpperCase()}</span></h3><div class="instr">${esc(it.instr)}</div><div class="names"><div class="t">Columna B — Nombres</div>${names}</div><div class="hint" style="font-weight:600;margin-top:12px;">Columna A</div>${rows}</div>`;
  }).join("");
}
function renderResult(){
  if(!S.checked) return "";
  const r = grade();
  const nota = Math.round(r.total/r.maxTotal*100);
  const msg = nota>=90 ? "¡Excelente! Estás listo para el examen." : nota>=70 ? "¡Muy bien! Repasá los temas con barras más cortas." : nota>=50 ? "Vas bien, pero conviene repasar la antología antes del examen." : "Repasá la antología con calma y volvé a intentarlo.";
  const temas = Object.keys(DATA.temas).map(k=>{
    const x = r.temas[k]; const p = x.p? Math.round(x.e/x.p*100):0;
    const col = p>=70?"var(--good)":p>=50?"var(--gold)":"var(--danger)";
    return `<div class="tema"><div class="row"><span>${esc(DATA.temas[k])}</span><span style="font-family:'IBM Plex Mono',monospace;">${x.e}/${x.p}</span></div><div class="track"><div class="fill" style="width:${p}%;background:${col};"></div></div></div>`;
  }).join("");
  return `<div class="card result" id="resultado">
    <div class="hint" style="text-transform:uppercase;letter-spacing:.6px;">Tu resultado</div>
    <div class="big">${nota}</div><div class="sub">sobre 100 · ${r.total} de ${r.maxTotal} puntos</div>
    <div class="msg">${msg}</div>
    <div class="secs"><div><div class="lb">Selección única</div><div class="v">${r.su}/${r.max.su}</div></div><div><div class="lb">Respuesta corta</div><div class="v">${r.rc}/${r.max.rc}</div></div><div><div class="lb">Correspondencia</div><div class="v">${r.c}/${r.max.c}</div></div></div>
    <div class="hint" style="text-align:left;margin-bottom:8px;text-transform:uppercase;letter-spacing:.4px;">Resultado por tema</div>${temas}
    <p class="hint" style="margin-top:16px;">Abajo podés revisar cada pregunta con su explicación. En verde lo correcto, en rojo lo que hay que repasar.</p>
    <button class="btn btn-dark" data-act="again">Hacer un nuevo intento</button>
  </div>`;
}
function render(){
  document.getElementById("app").innerHTML = `
  <div class="cover"><div class="cover-inner">
    <div class="brandbox"><img src="${LOGO}" alt="Escudo CTP Mercedes Norte"><div><div class="n">M.Sc. Ericka Hernández Mena</div><div class="r">Docente Técnica · CTP Mercedes Norte</div></div></div>
    <span class="tag">Práctica · no cuenta para la nota</span>
    <h1>Aplicación de la robótica</h1>
    <p>Unidad 3 · Décimo año · Programación y prueba de la seguridad del software</p>
  </div></div>
  <div class="wrap ${S.checked?"checked":""}">
    ${renderResult()}
    ${S.checked?"":`<div class="card intro"><b>Cómo usar esta práctica</b><ul>
      <li>Respondé todo con calma, usando solo lo que estudiaste en la antología.</li>
      <li>Cuando termines, tocá <b>Revisar mis respuestas</b>: verás tu nota, el resultado por tema y la explicación de cada pregunta.</li>
      <li>Podés hacer los intentos que quieras; cada intento cambia el orden de preguntas y opciones.</li></ul></div>`}
    <div class="card"><div class="sec-head"><span class="k">I</span><h2>Selección única</h2><span class="pts">${DATA.su.length} puntos</span></div>
      <div class="instr">Marque la opción correcta. Cada pregunta vale 1 punto.</div>${renderSU()}</div>
    <div class="card"><div class="sec-head"><span class="k">II</span><h2>Respuesta corta</h2><span class="pts">${DATA.rc.reduce((s,q)=>s+q.max,0)} puntos</span></div>
      <div class="instr">Escriba la cantidad de respuestas que se solicita en cada pregunta, una en cada espacio. Cada respuesta correcta vale 1 punto.</div>${renderRC()}</div>
    <div class="card"><div class="sec-head"><span class="k">III</span><h2>Correspondencia</h2><span class="pts">${DATA.c.length*5} puntos</span></div>
      <div class="instr">Esta parte tiene ${DATA.c.length} ítems de correspondencia de 5 puntos cada uno. Lea las instrucciones de cada ítem.</div>${renderC()}</div>
  </div>
  <div class="bar"><div class="bar-inner">
    <span class="count" id="count">${S.checked?"Práctica revisada":answeredCount()+" de "+TOTAL_ITEMS+" respondidas"}</span>
    <div class="sp">${S.checked?`<button class="btn btn-ghost" data-act="top">Ver mi nota</button><button class="btn btn-gold" data-act="again">Nuevo intento</button>`:`<button class="btn btn-gold" data-act="check">Revisar mis respuestas</button>`}</div>
  </div></div>`;
}
function updateCount(){ const el=document.getElementById("count"); if(el && !S.checked) el.textContent = answeredCount()+" de "+TOTAL_ITEMS+" respondidas"; }

document.addEventListener("change", e=>{
  const t = e.target; if(S.checked) return;
  if(t.dataset.su!==undefined){ S.su[+t.dataset.su] = +t.dataset.o; updateCount(); }
  else if(t.dataset.c!==undefined){ S.c[t.dataset.c] = t.value; const y = window.scrollY; render(); window.scrollTo(0,y); }
});
document.addEventListener("input", e=>{
  const t = e.target; if(S.checked || t.dataset.rc===undefined) return;
  const qi = +t.dataset.rc; S.rc[qi] = S.rc[qi]||[]; S.rc[qi][+t.dataset.i] = t.value; updateCount();
});
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act;
  if(a==="check"){
    const falt = TOTAL_ITEMS - answeredCount();
    if(falt>0 && !confirm("Te faltan "+falt+" respuestas. ¿Querés revisar de todas formas?")) return;
    S.checked = true; render(); window.scrollTo(0,0);
  }
  else if(a==="again"){ nuevoIntento(); }
  else if(a==="top"){ window.scrollTo({top:0,behavior:"smooth"}); }
});
nuevoIntento();
</script>
</body>
</html>
